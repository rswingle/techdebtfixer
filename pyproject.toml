[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techdebtfixer"
version = "0.2.0"
description = "Security posture, technical debt and maturity assessment CLI with a remediation roadmap, plus an encrypted credential vault TUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "techdebtfixer" }]
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.40", "cryptography>=41"]

[project.scripts]
techdebtfixer = "techdebtfixer.cli:main"

[tool.setuptools.packages.find]
include = ["techdebtfixer*"]
