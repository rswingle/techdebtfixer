name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with TUI extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[tui]'

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: CLI smoke checks
        run: |
          techdebtfixer --version
          techdebtfixer --list-connectors
          set +e
          techdebtfixer --connector demo > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "demo assessment unexpectedly clean"
            exit 1
          fi
          if [ "$code" -ne 1 ]; then
            echo "demo assessment failed with unexpected exit $code"
            exit 1
          fi
          echo "CLI smoke OK (demo exits 1 by design: critical findings)"
